name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure persistent APK signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOPPING_KEYSTORE_BASE64 }}
          SHOPPING_KEYSTORE_PASSWORD: ${{ secrets.SHOPPING_KEYSTORE_PASSWORD }}
          SHOPPING_KEY_ALIAS: ${{ secrets.SHOPPING_KEY_ALIAS }}
          SHOPPING_KEY_PASSWORD: ${{ secrets.SHOPPING_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" && -z "$SHOPPING_KEYSTORE_PASSWORD" && -z "$SHOPPING_KEY_ALIAS" && -z "$SHOPPING_KEY_PASSWORD" ]]; then
            exit 0
          fi
          : "${KEYSTORE_BASE64:?Missing SHOPPING_KEYSTORE_BASE64}"
          : "${SHOPPING_KEYSTORE_PASSWORD:?Missing SHOPPING_KEYSTORE_PASSWORD}"
          : "${SHOPPING_KEY_ALIAS:?Missing SHOPPING_KEY_ALIAS}"
          : "${SHOPPING_KEY_PASSWORD:?Missing SHOPPING_KEY_PASSWORD}"
          umask 077
          signing_file="$RUNNER_TEMP/shopping.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          {
            printf 'SHOPPING_KEYSTORE_PATH=%s\n' "$signing_file"
            printf 'SHOPPING_KEYSTORE_PASSWORD=%s\n' "$SHOPPING_KEYSTORE_PASSWORD"
            printf 'SHOPPING_KEY_ALIAS=%s\n' "$SHOPPING_KEY_ALIAS"
            printf 'SHOPPING_KEY_PASSWORD=%s\n' "$SHOPPING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test, lint and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nothing-shopping-widget
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
